# Publishes the Angular workspace at src/web as a static site. Nothing else in the repository is built or
# deployed: the API, gateway, worker and database are not part of this and the published bundle reaches no
# backend at all. With no /runtime-config.json to find, the SPA resolves its session and plan catalogue as
# "degraded"/empty by design, so the public landing page renders and the signed-in app does not.
name: Deploy web app to Azure Static Web Apps

on:
  push:
    branches: [dev]
    paths:
      - 'src/web/**'
      - '.github/workflows/azure-static-web-apps.yml'
  # Pull requests get their own temporary preview URL, which Azure tears down when the PR closes.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: static-web-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      # The build runs here rather than in the deploy action's own Oryx container: this is a monorepo whose
      # app target sits two directories down and shares a workspace with the @creator-pantry/ui library, and
      # Oryx's inferred build does not reliably reproduce `npm run build` (library, then showcase).
      - name: Install dependencies
        run: npm ci
        working-directory: src/web

      - name: Build library and web app
        run: npm run build
        working-directory: src/web

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Already-built output, so app_location is the folder to upload verbatim and output_location is
          # empty. staticwebapp.config.json ships inside it from src/web/public/.
          app_location: src/web/dist/showcase/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request preview
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
