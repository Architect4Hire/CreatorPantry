<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Everything from here to the social card is static on purpose (LP.10). A scraper is handed this
         document and never runs the application, so a tag set at runtime through Angular's Meta service is a
         tag no social preview, and no first pass of a crawler, ever sees. Prerendering would answer that too,
         but it would also bake a plan catalogue into the HTML, which this product does not do: prices are the
         server's at request time, never the build's.

         This document is served at every address, '' and /pricing among them, so the canonical names the
         landing page once. /pricing is that same page opened at its pricing section, not a second one, and
         saying so here is what keeps the two from competing as duplicates. Nothing a crawler would index sits
         behind the sign-in: robots.txt disallows the application's own routes outright. -->
    <title>CreatorPantry — the AI workspace for food creators</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="The AI-assisted workspace for food creators: develop and version recipes, turn them into blog posts, social captions and newsletters, and publish on your terms."
    />
    <link rel="canonical" href="https://creatorpantry.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CreatorPantry" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://creatorpantry.com/" />
    <meta property="og:title" content="CreatorPantry — the AI workspace for food creators" />
    <meta
      property="og:description"
      content="The AI-assisted workspace for food creators: develop and version recipes, turn them into blog posts, social captions and newsletters, and publish on your terms."
    />
    <!-- Built by `npm run make:og-card` from the real logo and typefaces, never hand-drawn and never a
         screenshot of work belonging to a creator. The alt text describes what is on it and nothing else. -->
    <meta property="og:image" content="https://creatorpantry.com/images/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The CreatorPantry logo on warm paper, beside the words “The workspace where your recipes become everything else.”"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CreatorPantry — the AI workspace for food creators" />
    <meta
      name="twitter:description"
      content="The AI-assisted workspace for food creators: develop and version recipes, turn them into blog posts, social captions and newsletters, and publish on your terms."
    />
    <meta name="twitter:image" content="https://creatorpantry.com/images/og-card.png" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The deployment settings the application awaits before it bootstraps (`provideAppInitializer`). Asking
         for it here starts it while the document is still being parsed, in parallel with main.js, instead of
         after the bundle has loaded and run — which is a whole round trip off the first paint of every page,
         not just this one. `crossorigin` because HttpClient fetches it with the default credentials mode, and a
         preload whose mode does not match is a preload the browser fetches twice. -->
    <link rel="preload" as="fetch" crossorigin href="/runtime-config.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- A plain stylesheet link: the Web host's CSP (script-src 'self') refuses an inline onload handler, so the
         print-media swap left the fonts unapplied in production. LP.11 can self-host them. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fredoka:wght@500;600;700&display=swap"
    />
    <!-- The logo is on every page's first screen (landing hero, sign-in, the shell), in the resolved theme's
         rendition. Preloaded for the system theme; a saved override fetches the other when the app starts. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/logo-400.webp"
      imagesrcset="/images/logo-200.webp 200w, /images/logo-400.webp 400w"
      imagesizes="12.5rem"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/logodark-400.webp"
      imagesrcset="/images/logodark-200.webp 200w, /images/logodark-400.webp 400w"
      imagesizes="12.5rem"
      media="(prefers-color-scheme: dark)"
    />
    <!-- The hero collage's front photograph: above the fold at every width, and the largest thing on the first
         screen after the headline. It is named here because LP.11 fixed the collage's three photos; while they
         were dealt at random, nothing could be asked for until the lazy landing chunk had run and chosen them
         (LP.1 finding 2). AVIF alone on purpose: a second preload for the WebP would be fetched as well by
         every browser that reads both, which is the opposite of the point. `landing-document-head.spec.ts`
         fails if this stops naming HERO_COLLAGE_PHOTOS.front. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/images/food/photo-1-480.avif"
      imagesrcset="/images/food/photo-1-480.avif 480w, /images/food/photo-1-960.avif 960w"
      imagesizes="(min-width: 64rem) 15rem, 41vw"
    />
  </head>
  <body>
    <cp-root></cp-root>
  </body>
</html>
