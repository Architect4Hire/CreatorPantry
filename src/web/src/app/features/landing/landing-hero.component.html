<section class="hero" aria-labelledby="landing-hero-heading">
  <div class="copy">
    <cp-logo class="mark" [priority]="true" />
    <!-- Control flow sits flush against the text: splitting it onto its own lines adds rendered whitespace. -->
    <!-- prettier-ignore -->
    <h1 id="landing-hero-heading">
      {{ parts().before }}@if (parts().marked) {<span class="highlight">{{ parts().marked }}</span>}{{ parts().after }}
    </h1>
    <p class="subheadline">{{ subheadline() }}</p>
    <div class="ctas">
      <a cpButton variant="primary" size="lg" routerLink="/sign-up">{{ primaryCtaLabel() }}</a>
      <a cpButton variant="secondary" size="lg" routerLink="/sign-in">{{ secondaryCtaLabel() }}</a>
    </div>
    @if (note()) {
      <p class="note">{{ note() }}</p>
    }
  </div>
  <div class="media"><ng-content select="[cpLandingHeroMedia]" /></div>
</section>
