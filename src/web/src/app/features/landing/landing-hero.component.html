<section class="hero" aria-labelledby="landing-hero-heading">
  <div class="copy">
    <div>
      <div>
        <h1 id="landing-hero-heading">{{ headline() }}</h1>
        <p class="subheadline">{{ subheadline() }}</p>
      </div>
      <div class="ctas">
        <a cpButton variant="primary" size="lg" routerLink="/sign-up">{{
          primaryCtaLabel()
        }}</a>
        <a cpButton variant="secondary" size="lg" routerLink="/sign-in">{{
          secondaryCtaLabel()
        }}</a>
      </div>
    </div>
    <div>
      <cp-logo styles="height: 500px"></cp-logo>
    </div>
  </div>
  <div class="media"><ng-content select="[cpLandingHeroMedia]" /></div>
</section>
