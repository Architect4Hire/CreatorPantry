<section class="hero" aria-labelledby="landing-hero-heading">
  <div class="copy">
    <div class="intro">
      <div class="text">
        <h1 id="landing-hero-heading">{{ headline() }}</h1>
        <p class="subheadline">{{ subheadline() }}</p>
      </div>
      <div class="ctas">
        <a cpButton variant="primary" size="lg" routerLink="/sign-up">{{ primaryCtaLabel() }}</a>
        <a cpButton variant="secondary" size="lg" routerLink="/sign-in">{{ secondaryCtaLabel() }}</a>
      </div>
    </div>
    <div class="mark">
      <cp-logo styles="display: block; width: 100%; height: auto; margin-inline: auto"></cp-logo>
    </div>
  </div>
  <div class="media"><ng-content select="[cpLandingHeroMedia]" /></div>
</section>
