<section class="how-it-works" aria-labelledby="landing-how-it-works-heading">
  <h2 id="landing-how-it-works-heading">{{ heading() }}</h2>
  @if (note()) {
    <p class="note">{{ note() }}</p>
  }
  <ol class="steps" role="list">
    @for (step of steps(); track step.heading; let i = $index) {
      <li>
        <span class="step-number" aria-hidden="true">{{ i + 1 }}</span>
        <div class="step-copy">
          <h3>{{ step.heading }}</h3>
          <p>{{ step.body }}</p>
        </div>
      </li>
    }
  </ol>
</section>
