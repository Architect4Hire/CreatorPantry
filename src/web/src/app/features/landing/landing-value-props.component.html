<section class="value-props" aria-labelledby="landing-value-props-heading">
  <h2 id="landing-value-props-heading">{{ heading() }}</h2>
  @if (intro()) {
    <p class="intro">{{ intro() }}</p>
  }
  <ul cpCardGrid minColumn="18rem">
    @for (item of items(); track item.heading) {
      <li>
        <cp-card>
          <cp-badge [tone]="item.badgeTone">{{ item.badgeLabel }}</cp-badge>
          <h3>{{ item.heading }}</h3>
          <p>{{ item.body }}</p>
          @if (onTour(item.tourPanel)) {
            <a class="tour-link" [href]="'#tour-' + item.tourPanel">See it in the tour<span class="cp-sr-only">: {{ item.heading }}</span></a>
          }
        </cp-card>
      </li>
    }
  </ul>
</section>
