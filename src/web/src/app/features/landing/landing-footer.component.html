<footer class="landing-footer">
  <div class="legal-placeholders">
    @for (link of legalLinks(); track link) {
      <button type="button" class="legal-link" disabled>
        {{ link }} <span class="coming-soon">(coming soon)</span>
      </button>
    }
  </div>
  <span class="brand">© {{ currentYear }} {{ productName() }}</span>
</footer>
