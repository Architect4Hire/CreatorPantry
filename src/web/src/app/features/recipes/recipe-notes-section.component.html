<cp-form-section sectionId="section-notes" heading="Notes">
  <!-- Each field says what it holds rather than repeating the section's heading. -->
  <cp-field label="Tips and variations" forId="recipe-notes" [error]="form.fieldError('notes')">
    <textarea
      id="recipe-notes"
      placeholder="e.g. Brown the butter first for a nuttier taste"
      [ngModel]="form.notes()"
      (ngModelChange)="form.notes.set($event)"
      name="notes"
    ></textarea>
  </cp-field>

  <cp-field label="Storing and reheating" forId="recipe-storage-notes" [error]="form.fieldError('storageNotes')">
    <textarea
      id="recipe-storage-notes"
      placeholder="e.g. Store airtight, reheat gently"
      [ngModel]="form.storageNotes()"
      (ngModelChange)="form.storageNotes.set($event)"
      name="storageNotes"
    ></textarea>
  </cp-field>
</cp-form-section>
