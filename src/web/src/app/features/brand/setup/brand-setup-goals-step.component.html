<form class="goals" (submit)="$event.preventDefault()" novalidate>
  <cp-form-section heading="What are you creating for?" intro="Pick all that apply.">
    <cp-choice-group
      label="What are you creating for?"
      idPrefix="cp-goals-purpose-"
      [options]="purposeChoices"
      [multiple]="true"
      [value]="answers().purposes"
      (valueChange)="setPurposes($event)"
    />
    @if (has(answers().purposes, 'other')) {
      <cp-field label="Tell us more" forId="cp-goals-purpose-note">
        <input id="cp-goals-purpose-note" type="text" [maxLength]="noteMax" [value]="answers().purposeNote" (input)="setText('purposeNote', $event)" />
      </cp-field>
    }
  </cp-form-section>

  <cp-form-section heading="Who are you writing for?" intro="Pick the closest match. You can change it later.">
    <cp-choice-group
      label="Who are you writing for?"
      idPrefix="cp-goals-audience-"
      [options]="audienceChoices"
      [value]="[answers().audience]"
      (valueChange)="setAudience($event)"
    />
    @if (answers().audience === 'other') {
      <cp-field label="Tell us more" forId="cp-goals-audience-note">
        <input id="cp-goals-audience-note" type="text" [maxLength]="noteMax" [value]="answers().audienceNote" (input)="setText('audienceNote', $event)" />
      </cp-field>
    }
  </cp-form-section>

  <cp-form-section heading="Where will you share it?" intro="Pick all that apply.">
    <cp-choice-group
      label="Where will you share it?"
      idPrefix="cp-goals-channel-"
      layout="fit"
      [options]="channelChoices"
      [multiple]="true"
      [value]="answers().channels"
      (valueChange)="setChannels($event)"
    />
    @if (has(answers().channels, 'other')) {
      <cp-field label="Where?" forId="cp-goals-channel-note">
        <input id="cp-goals-channel-note" type="text" [maxLength]="noteMax" [value]="answers().channelNote" (input)="setText('channelNote', $event)" />
      </cp-field>
    }
  </cp-form-section>

  <!-- A disclosure rather than a fourth section: these are extras, and a section whose whole content is one
       collapsed control is a heading with nothing under it. The examples step's "More options" is the same shape. -->
  <details class="cp-disclosure" [open]="hasDetails()">
    <summary>More details</summary>
    <div class="more-body">
      <cp-field label="What makes your food different?" forId="cp-goals-different" hint="A sentence is plenty.">
        <textarea id="cp-goals-different" [maxLength]="differentMax" [value]="answers().different" (input)="setText('different', $event)"></textarea>
      </cp-field>
      <cp-field label="Anything you never want to talk about?" forId="cp-goals-avoid">
        <textarea id="cp-goals-avoid" [maxLength]="avoidMax" [value]="answers().avoid" (input)="setText('avoid', $event)"></textarea>
      </cp-field>
      <cp-field label="Your website address" forId="cp-goals-website" hint="We only save it. We don't visit it." [error]="websiteError()">
        <input
          id="cp-goals-website"
          type="url"
          inputmode="url"
          autocomplete="url"
          [maxLength]="websiteMax"
          [value]="answers().website"
          [attr.aria-invalid]="websiteError() ? 'true' : null"
          (input)="setText('website', $event)"
        />
      </cp-field>
    </div>
  </details>

  @if (!complete() && !websiteError()) {
    <p class="cp-muted" [attr.role]="touched() ? 'status' : null">
      Pick at least one thing you're creating for and one place you'll share, then press Continue.
    </p>
  }
</form>
