<form class="style" (submit)="$event.preventDefault()" novalidate>
  @for (q of questions; track q.key) {
    <cp-form-section [heading]="q.heading" [intro]="q.intro">
      <cp-choice-group
        [label]="q.heading"
        [idPrefix]="'cp-style-' + q.key + '-'"
        [options]="choicesFor(q)"
        [multiple]="q.multiple"
        [max]="q.multiple ? tonesMax : null"
        [value]="shown(q)"
        (valueChange)="setChoices(q, $event)"
      />
      @if (q.multiple && answers().choices[q.key].length >= tonesMax) {
        <p class="cp-muted" role="status">That's {{ tonesMax }}. Untick one to pick a different feel.</p>
      }
      <cp-field label="In your own words" [forId]="'cp-style-' + q.key + '-note'">
        <input
          type="text"
          [id]="'cp-style-' + q.key + '-note'"
          [maxLength]="noteMax"
          [value]="answers().notes[q.key]"
          (input)="setNote(q.key, $event)"
        />
      </cp-field>
    </cp-form-section>
  }
</form>
