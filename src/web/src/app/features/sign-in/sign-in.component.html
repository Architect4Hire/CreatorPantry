<cp-auth-layout
  headline="Where your recipes become stories."
  dek="Develop, version and publish your food writing — recipe card, blog post and captions from one source."
>
  <form class="sign-in-card" (submit)="$event.preventDefault(); submit()">
    <div class="intro">
      <h1>Welcome back</h1>
      <p>Sign in to pick up where you left off in your kitchen.</p>
    </div>

    @if (degraded) {
      <p class="banner" role="status">We couldn't confirm your session just now. You can still try signing in.</p>
    }

    @if (errorMessage()) {
      <p class="banner banner--error" role="alert">{{ errorMessage() }}</p>
    }

    <cp-field label="Email" forId="sign-in-email" [required]="true">
      <input
        id="sign-in-email"
        type="email"
        autocomplete="username"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
      />
    </cp-field>

    <cp-field label="Password" forId="sign-in-password" [required]="true">
      <input
        id="sign-in-password"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
      />
    </cp-field>

    <button cpButton type="submit" [fullWidth]="true" [disabled]="submitting()" [busy]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="footer-link">New to CreatorPantry? <a routerLink="/sign-up">Create an account</a></p>
  </form>
</cp-auth-layout>
