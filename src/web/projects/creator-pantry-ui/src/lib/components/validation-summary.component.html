@if (announce()) {
  <p class="sr-only" role="status">{{ announcement() }}</p>
}
@if (ordered().length > 0) {
  <section tabindex="-1" #panel [attr.aria-label]="label()" [class.advice-only]="!hasErrors()">
    <ul>
      @for (issue of ordered(); track $index) {
        <li [class.advice]="issue.severity !== 'error'">
          <button type="button" (click)="issueSelected.emit(issue)">
            @if (issue.severity !== 'error') {
              <span class="kind">{{ issue.severity === 'info' ? 'Note:' : 'Heads up:' }}</span>
            }
            @if (labelOf()(issue.path); as where) {
              <span class="where">{{ where }}</span>
            }
            <span class="message">{{ issue.message }}</span>
          </button>
        </li>
      }
    </ul>
  </section>
}
